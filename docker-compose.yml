version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    env_file:
      - .env

    volumes:
      - ./.gcloud:/usr/app/.gcloud
      - ./src:/usr/app/src
      - ./package.json:/usr/app/package.json
      - ./bun.lockb:/usr/app/bun.lockb
      - ./tsconfig.json:/usr/app/tsconfig.json
    depends_on:
      - redis
    restart: unless-stopped
    command: ['bun', 'run', 'start:dev']

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

volumes:
  redis-data:
