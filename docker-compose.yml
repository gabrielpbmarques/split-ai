version: '3.8'

services:
  token-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: token-service
    restart: unless-stopped
    ports:
      - '8080:80'
    env_file:
      - .env
    environment:
      - BUN_ENV=development
    networks:
      - token-network

networks:
  token-network:
    driver: bridge
