version: '3.8'

services:
  anthor-agi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anthor-agi
    restart: unless-stopped
    ports:
      - '8080:80'
    env_file:
      - .env
    environment:
      - BUN_ENV=development
    networks:
      - anthor-agi

networks:
  token-network:
    driver: bridge
