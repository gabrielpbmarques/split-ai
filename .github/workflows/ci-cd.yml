name: CI/CD for Anthor

concurrency:
  group: ci-cd-anthor-agi-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: ['opened', 'synchronize', 'reopened', 'ready_for_review']
    branches:
      - master
      - develop
    paths:
      - src/**
      - .github/workflows/**
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - uses: jwalton/gh-find-current-pr@v1
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        id: findPr
        with:
          state: open

  cd-prod:
    name: Deploy Prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          token_format: 'access_token'

      - name: Docker configuration
        uses: 'docker/login-action@v2'
        with:
          registry: 'us-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Build Prod Docker Image
        env:
          ENV: production
          GCP_DOCKER_IMAGE: us-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/gcr.io/anthor-agi
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: docker build -t $GCP_DOCKER_IMAGE:${GITHUB_SHA::8} .

      - name: Publish Prod
        run: |-
          docker push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/gcr.io/anthor-agi:${GITHUB_SHA::8}"

      - name: Deploy Prod
        env:
          ENV: production
          GCP_DOCKER_IMAGE: us-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/gcr.io/anthor-agi
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT }}
          CLOUDSDK_COMPUTE_REGION: southamerica-east1
          GOOGLE_APPLICATION_CREDENTIALS: './.gcloud/kms/google.json'
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          WELCOME_EMAIL_TEMPLATE_ID: ${{ secrets.WELCOME_EMAIL_TEMPLATE_ID }}
          APPROVED_EMAIL_TEMPLATE_ID: ${{ secrets.APPROVED_EMAIL_TEMPLATE_ID }}
          FINISH_EMAIL_TEMPLATE_ID: ${{ secrets.FINISH_EMAIL_TEMPLATE_ID }}
          SENDGRID_EMAIL: ${{ secrets.SENDGRID_EMAIL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |-
          gcloud run deploy anthor-agi --region $CLOUDSDK_COMPUTE_REGION \
          --image $GCP_DOCKER_IMAGE:${GITHUB_SHA::8} \
          --timeout 3600 \
          --min-instances 1 \
          --max-instances 100 \
          --memory 2Gi \
          --cpu 2 \
          --set-env-vars NODE_ENV=$ENV \
          --set-env-vars MONGO_URI=$MONGO_URI \
          --set-env-vars SENTRY_DSN=$SENTRY_DSN \
          --set-env-vars TOKEN_EXPIRATION_TIME=$TOKEN_EXPIRATION_TIME \
          --set-env-vars GCP_PROJECT_ID=$CLOUDSDK_CORE_PROJECT \
          --set-env-vars GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS \
          --set-env-vars JWT_SECRET=$JWT_SECRET \
          --set-env-vars EMBEDDING_MODEL=$EMBEDDING_MODEL \
          --set-env-vars AI_MODEL=$AI_MODEL \
          --set-env-vars REDIS_URL=$REDIS_URL \
          --set-env-vars REDIS_HOST=$REDIS_HOST \
          --set-env-vars REDIS_PORT=$REDIS_PORT \
          --set-env-vars SUPABASE_URL=$SUPABASE_URL \
          --set-env-vars SUPABASE_API_KEY=$SUPABASE_API_KEY \
          --set-env-vars AWS_REGION=$AWS_REGION \
          --set-env-vars AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
          --set-env-vars AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
          --set-env-vars AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME \
          --set-env-vars WELCOME_EMAIL_TEMPLATE_ID=$WELCOME_EMAIL_TEMPLATE_ID \
          --set-env-vars APPROVED_EMAIL_TEMPLATE_ID=$APPROVED_EMAIL_TEMPLATE_ID \
          --set-env-vars FINISH_EMAIL_TEMPLATE_ID=$FINISH_EMAIL_TEMPLATE_ID \
          --set-env-vars SENDGRID_EMAIL=$SENDGRID_EMAIL \
          --set-env-vars SENDGRID_API_KEY=$SENDGRID_API_KEY
