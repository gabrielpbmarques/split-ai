name: CI/CD for Split AI

concurrency:
  group: ci-cd-split-ai-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: ['opened', 'synchronize', 'reopened', 'ready_for_review']
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/**
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - uses: jwalton/gh-find-current-pr@v1
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        id: findPr
        with:
          state: open

  cd-prod:
    name: Deploy Prod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'
          token_format: 'access_token'

      - name: Docker configuration
        uses: 'docker/login-action@v2'
        with:
          registry: 'southamerica-east1-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Build Prod Docker Image
        env:
          ENV: production
          GCP_DOCKER_IMAGE: southamerica-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/ai/split-ai
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: docker build -t $GCP_DOCKER_IMAGE:${GITHUB_SHA::8} .

      - name: Publish Prod
        run: |-
          docker push "southamerica-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/ai/split-ai:${GITHUB_SHA::8}"

      - name: Deploy Prod
        env:
          ENV: production
          GCP_DOCKER_IMAGE: southamerica-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/ai/split-ai
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT }}
          CLOUDSDK_COMPUTE_REGION: southamerica-east1
          # Configurações da Aplicação
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # JWT
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          # Banco de Dados
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          # SendGrid
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_EMAIL_DEFAULT_FROM: ${{ secrets.SENDGRID_EMAIL_DEFAULT_FROM }}
          # Google Credentials
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          # Redis
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Twilio
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WEBHOOK_BASE_URL: ${{ secrets.TWILIO_WEBHOOK_BASE_URL }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
        run: |-
          gcloud run deploy split-ai --region $CLOUDSDK_COMPUTE_REGION \
          --allow-unauthenticated \
          --image $GCP_DOCKER_IMAGE:${GITHUB_SHA::8} \
          --min-instances 1 \
          --max-instances 2 \
          --memory 4Gi \
          --cpu 4 \
          --set-env-vars ENV=$ENV \
          --set-env-vars NODE_ENV=ENV \
          --set-env-vars EMBEDDING_MODEL=$EMBEDDING_MODEL \
          --set-env-vars AI_MODEL=$AI_MODEL \
          --set-env-vars JWT_SECRET=$JWT_SECRET \
          --set-env-vars JWT_EXPIRATION=$JWT_EXPIRATION \
          --set-env-vars DATABASE_HOST=$DATABASE_HOST \
          --set-env-vars DATABASE_PORT=$DATABASE_PORT \
          --set-env-vars DATABASE_USERNAME=$DATABASE_USERNAME \
          --set-env-vars DATABASE_PASSWORD=$DATABASE_PASSWORD \
          --set-env-vars DATABASE_NAME=$DATABASE_NAME \
          --set-env-vars SUPABASE_URL=$SUPABASE_URL \
          --set-env-vars SUPABASE_API_KEY=$SUPABASE_API_KEY \
          --set-env-vars SENDGRID_API_KEY=$SENDGRID_API_KEY \
          --set-env-vars SENDGRID_EMAIL_DEFAULT_FROM=$SENDGRID_EMAIL_DEFAULT_FROM \
          --set-env-vars REDIS_URL=$REDIS_URL \
          --set-env-vars TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER \
          --set-env-vars TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID \
          --set-env-vars TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN \
          --set-env-vars TWILIO_WEBHOOK_BASE_URL=$TWILIO_WEBHOOK_BASE_URL \
          --set-env-vars GCP_PROJECT_ID=$CLOUDSDK_CORE_PROJECT \
          --set-env-vars GOOGLE_GEOCODING_API_KEY=$GOOGLE_GEOCODING_API_KEY
