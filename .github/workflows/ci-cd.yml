name: CI/CD for Split AI

concurrency:
  group: ci-cd-split-ai-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: ['opened', 'synchronize', 'reopened', 'ready_for_review']
    branches:
      - main
    paths:
      - src/**
      - test/**
      - scripts/**
      - package.json
      - bun.lock
      - .github/workflows/**
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: split_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: End-to-end tests
        run: bun run test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/split_ai_test
          JWT_SECRET: ci-only-secret

      - name: Build
        run: bun run build

      - uses: jwalton/gh-find-current-pr@v1
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        id: findPr
        with:
          state: open

  migrate:
    name: Database migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    concurrency:
      group: db-migrations-split-ai
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
        run: bun run db:migrate
